name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.25"}
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
      - run: go test -race ./...
  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix: {service: [auction-service, bidder-mock, event-consumer]}
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg SERVICE=${{ matrix.service }} -t minibid/${{ matrix.service }} .
